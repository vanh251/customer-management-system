        body {

            background-color: theme('colors.surface-container-low');

<body class="antialiased min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
<main class="sm:mx-auto sm:w-full sm:max-w-md">
<!-- Login Card Container -->
<div class="bg-surface-container-lowest px-8 py-10 shadow-[0px_4px_12px_rgba(15,23,42,0.08)] rounded-xl sm:px-12 border border-surface-variant">
<!-- Brand & Header -->
<div class="flex flex-col items-center mb-8">
<div class="flex items-center gap-2 mb-6">
<span class="material-symbols-outlined text-[32px] text-primary" style="font-variation-settings: 'FILL' 1;">dashboard</span>
<span class="font-h3 text-h3 text-on-surface font-black tracking-wide">Admin Suite</span>
</div>
<h1 class="font-h2 text-h2 text-on-surface">Chào Mừng Trở Lại</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2 text-center">
                    Nhập thông tin đăng nhập để truy cập bảng điều khiển.
                </p>
</div>
<!-- Login Form -->
<form action="#" class="space-y-6" method="POST" id="loginForm">
<div id="loginError" class="hidden px-4 py-3 rounded-lg text-error bg-error-container font-body-sm text-body-sm text-center"></div>
<!-- Email Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label-sm text-label-sm text-on-surface" for="email">
                        Địa chỉ Email
                    </label>
<div class="relative">
<input autocomplete="email" class="appearance-none block w-full px-3 py-2 border border-outline rounded-DEFAULT bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-base text-body-base transition-colors" id="email" name="email" placeholder="admin@commercesuite.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack-sm">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-surface" for="password">
                            Mật khẩu
                        </label>
<div class="text-sm">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors focus:outline-none focus:underline" href="#">
                                Quên mật khẩu?
                            </a>
</div>
</div>
<div class="relative">
<input autocomplete="current-password" class="appearance-none block w-full px-3 py-2 border border-outline rounded-DEFAULT bg-surface-container-lowest text-on-surface placeholder-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary font-body-base text-body-base transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Action -->
<div class="pt-2">
<button class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm font-label-md text-label-md text-on-primary bg-primary hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors active:scale-[0.99]" type="submit">
                        Đăng Nhập
                    </button>
</div>
</form>
</div>
</main>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
